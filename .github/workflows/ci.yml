name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run at 02:00 UTC — executes the real-PG integration suite
    - cron: "0 2 * * *"

jobs:
  # ===========================================
  # Python - ACN Core & Python SDK
  # ===========================================
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Real Postgres for tests under ``tests/integration/`` that
      # exercise raw ``text()`` SQL (PR #33 / #34 were both silent
      # bugs that in-memory fakes could not catch). Gated behind
      # ``ACN_INTEGRATION_PG_URL``; without that env var the tests
      # ``pytest.skip`` and a laptop ``pytest`` still passes.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acn
          POSTGRES_PASSWORD: acn
          POSTGRES_DB: acn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acn -d acn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (ACN Core)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy acn

      - name: Test (pytest)
        run: uv run pytest -v --cov=acn --cov-report=xml
        env:
          REDIS_URL: redis://localhost:6379
          ENABLE_DOCS: "true"
          # Enables ``tests/integration/test_settlement_outbox_pg.py``.
          # Without this, the integration tests in that file skip
          # silently — exactly the gap that let PR #33 (text() parser
          # collision) and PR #34 (uuid type mismatch) ship to prod.
          ACN_INTEGRATION_PG_URL: postgresql+asyncpg://acn:acn@localhost:5432/acn_test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: python
          name: acn-python
        continue-on-error: true

  # ===========================================
  # Python SDK
  # ===========================================
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          cd clients/python
          uv sync --extra dev

      - name: Lint
        run: |
          cd clients/python
          uv run ruff check .

      - name: Type check (mypy)
        run: |
          cd clients/python
          uv run mypy acn_client

      - name: Test import
        run: |
          cd clients/python
          uv run python -c "from acn_client import ACNClient, ACNError; print('✅ Import OK')"

  # ===========================================
  # CLI (TypeScript) — vitest + typecheck
  # ===========================================
  cli:
    name: CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/cli/package-lock.json

      - name: Install dependencies
        run: |
          cd clients/cli
          npm ci

      - name: Type check (src)
        run: |
          cd clients/cli
          npm run typecheck

      - name: Type check (tests)
        run: |
          cd clients/cli
          npm run typecheck:tests

      - name: Test (vitest)
        run: |
          cd clients/cli
          npm test

  # ===========================================
  # TypeScript SDK
  # ===========================================
  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install dependencies
        run: |
          cd clients/typescript
          npm ci

      - name: Type check
        run: |
          cd clients/typescript
          npm run typecheck

      - name: Build
        run: |
          cd clients/typescript
          npm run build

      - name: Verify build output
        run: |
          cd clients/typescript
          test -f dist/index.js && echo "✅ CJS build OK"
          test -f dist/index.mjs && echo "✅ ESM build OK"
          test -f dist/index.d.ts && echo "✅ DTS build OK"

  # ===========================================
  # Docker Build
  # ===========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: acn:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # D-5: Version / CHANGELOG sync check
  # Ensures pyproject.toml / package.json version has a matching dated
  # entry in CHANGELOG.md. Prevents the "version was bumped but CHANGELOG
  # only has [Unreleased]" drift (root-cause category from issue #73).
  #
  # Logic: if the package declares version X.Y.Z, then CHANGELOG.md must
  # contain a "## [X.Y.Z]" line. Normal development PRs (no version bump)
  # always pass because the current release version already has its entry.
  # ===========================================
  version-sync:
    name: Version / CHANGELOG sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Check Python SDK (clients/python)
        run: |
          cd clients/python
          PKG_VER=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! grep -qF "## [$PKG_VER]" CHANGELOG.md; then
            echo "❌ clients/python: pyproject.toml version $PKG_VER has no matching '## [$PKG_VER]' entry in CHANGELOG.md"
            echo "   Either add a dated CHANGELOG entry (release PR) or revert the version bump (dev PR)."
            exit 1
          fi
          echo "✅ Python SDK $PKG_VER — in sync"

      - name: Check TypeScript SDK (clients/typescript)
        run: |
          cd clients/typescript
          PKG_VER=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if ! grep -qF "## [$PKG_VER]" CHANGELOG.md; then
            echo "❌ clients/typescript: package.json version $PKG_VER has no matching '## [$PKG_VER]' entry in CHANGELOG.md"
            echo "   Either add a dated CHANGELOG entry (release PR) or revert the version bump (dev PR)."
            exit 1
          fi
          echo "✅ TypeScript SDK $PKG_VER — in sync"

      - name: Check CLI (clients/cli)
        run: |
          cd clients/cli
          PKG_VER=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if ! grep -qF "## [$PKG_VER]" CHANGELOG.md; then
            echo "❌ clients/cli: package.json version $PKG_VER has no matching '## [$PKG_VER]' entry in CHANGELOG.md"
            echo "   Either add a dated CHANGELOG entry (release PR) or revert the version bump (dev PR)."
            exit 1
          fi
          echo "✅ CLI $PKG_VER — in sync"

  # ===========================================
  # B: Consumer-compat (dogfood smoke test)
  #
  # Purpose: catch "public SDK symbol removed but still imported by a
  # first-party consumer" BEFORE merge — the root-cause class of the
  # 2026-05-16 backend 502 incident (issue #73).
  #
  # Mechanism:
  #   1. Installs the Python SDK from the local checkout (not PyPI) so the
  #      test exercises exactly what this PR would ship.
  #   2. Fetches each known consumer's SDK-wrapper file via the GitHub API
  #      (read-only access; no need to checkout the full consumer repo).
  #   3. Parses the `from acn_client import ...` statements with the AST
  #      module and verifies every named symbol resolves.
  #
  # Secret required: CONSUMER_REPOS_PAT
  #   A GitHub PAT with `contents:read` on the private consumer repos.
  #   If the secret is absent (e.g. forks), the consumer steps are skipped
  #   with a visible warning — the other SDK checks (typecheck, build) still
  #   run normally.
  #
  # Consumer list (update when a new first-party consumer adopts acn-client):
  #   - acnlabs/Agentplanet-backend  → app/services/acn_client.py  (Python)
  #   - acnlabs/paperclip-acn-plugin → src/acn/client.ts            (TypeScript, TODO)
  # ===========================================
  consumer-compat:
    name: Consumer-compat (dogfood smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python SDK from local source
        run: |
          cd clients/python
          uv sync
          # Expose the installed SDK on the PATH-visible venv for the smoke step
          echo "CONSUMER_VENV=$(pwd)/.venv" >> $GITHUB_ENV

      # Detect whether the PAT is configured. Secrets cannot be compared
      # directly in step `if:` expressions; we expose it via a step output
      # instead.
      - name: Detect CONSUMER_REPOS_PAT availability
        id: pat-check
        run: |
          if [ -n "$PAT" ]; then
            echo "available=true"  >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          PAT: ${{ secrets.CONSUMER_REPOS_PAT }}

      - name: Fetch Agentplanet-backend SDK wrapper
        if: steps.pat-check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_REPOS_PAT }}
        run: |
          gh api repos/acnlabs/Agentplanet-backend/contents/app/services/acn_client.py \
            | python3 -c "
          import json, sys, base64
          d = json.load(sys.stdin)
          print(base64.b64decode(d['content']).decode())
          " > /tmp/consumer_backend_acn.py
          echo "✅ Fetched Agentplanet-backend/app/services/acn_client.py"

      - name: Smoke test — Agentplanet-backend (Python)
        if: steps.pat-check.outputs.available == 'true'
        run: |
          $CONSUMER_VENV/bin/python3 - <<'PYEOF'
          import ast, sys

          with open("/tmp/consumer_backend_acn.py") as f:
              source = f.read()

          tree = ast.parse(source)
          to_check = []
          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom) and node.module == "acn_client":
                  to_check.extend(alias.name for alias in node.names)

          if not to_check:
              print("No acn_client imports found — nothing to check")
              sys.exit(0)

          print(f"Checking {len(to_check)} symbol(s): {to_check}")
          failed = []
          for name in to_check:
              try:
                  exec(f"from acn_client import {name}")
              except ImportError as e:
                  failed.append(f"  ❌ {name}: {e}")

          if failed:
              print("\nFailed imports from Agentplanet-backend:")
              for msg in failed:
                  print(msg)
              print(
                  "\nFix: either restore/deprecate the removed symbol in the SDK "
                  "or update Agentplanet-backend to use the replacement "
                  "before merging this PR."
              )
              sys.exit(1)
          else:
              print(f"✅ Agentplanet-backend: all {len(to_check)} acn_client imports OK")
          PYEOF

      - name: Skip notice — CONSUMER_REPOS_PAT not configured
        if: steps.pat-check.outputs.available != 'true'
        run: |
          echo "⚠️  CONSUMER_REPOS_PAT secret is not set."
          echo "   Consumer-compat checks were skipped. To enable full coverage:"
          echo "   1. Create a GitHub PAT with contents:read on acnlabs private repos."
          echo "   2. Add it as a repo secret named CONSUMER_REPOS_PAT."
          echo "   See docs/adr/0005-sdk-governance.md for details."

  # ===========================================
  # Integration — real-PG tests (opt-in)
  # Triggered by:
  #   • PR label "run-integration-tests"
  #   • Nightly schedule on main (02:00 UTC)
  # Skipped on normal PRs to keep CI fast.
  # See docs/integration-testing.md for local usage.
  # ===========================================
  integration:
    name: Integration (real-PG)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-integration-tests'))

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acn
          POSTGRES_PASSWORD: acn
          POSTGRES_DB: acn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run real-PG integration tests
        env:
          ACN_INTEGRATION_PG_URL: postgresql+asyncpg://acn:acn@localhost:5432/acn_test
          INTERNAL_API_TOKEN: test-internal-token-must-be-at-least-32-characters-long
          DEV_MODE: "true"
          HOST: "127.0.0.1"
        run: uv run pytest tests/integration -m integration -v --tb=short --no-cov

