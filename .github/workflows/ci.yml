name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================
  # Python - ACN Core & Python SDK
  # ===========================================
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Real Postgres for tests under ``tests/integration/`` that
      # exercise raw ``text()`` SQL (PR #33 / #34 were both silent
      # bugs that in-memory fakes could not catch). Gated behind
      # ``ACN_INTEGRATION_PG_URL``; without that env var the tests
      # ``pytest.skip`` and a laptop ``pytest`` still passes.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acn
          POSTGRES_PASSWORD: acn
          POSTGRES_DB: acn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acn -d acn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (ACN Core)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy acn

      - name: Test (pytest)
        run: uv run pytest -v --cov=acn --cov-report=xml
        env:
          REDIS_URL: redis://localhost:6379
          ENABLE_DOCS: "true"
          # Enables ``tests/integration/test_settlement_outbox_pg.py``.
          # Without this, the integration tests in that file skip
          # silently — exactly the gap that let PR #33 (text() parser
          # collision) and PR #34 (uuid type mismatch) ship to prod.
          ACN_INTEGRATION_PG_URL: postgresql+asyncpg://acn:acn@localhost:5432/acn_test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: python
          name: acn-python
        continue-on-error: true

  # ===========================================
  # Python SDK
  # ===========================================
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          cd clients/python
          uv sync --extra dev

      - name: Lint
        run: |
          cd clients/python
          uv run ruff check .

      - name: Type check (mypy)
        run: |
          cd clients/python
          uv run mypy acn_client

      - name: Test import
        run: |
          cd clients/python
          uv run python -c "from acn_client import ACNClient, ACNError; print('✅ Import OK')"

  # ===========================================
  # CLI (TypeScript) — vitest + typecheck
  # ===========================================
  cli:
    name: CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/cli/package-lock.json

      - name: Install dependencies
        run: |
          cd clients/cli
          npm ci

      - name: Type check (src)
        run: |
          cd clients/cli
          npm run typecheck

      - name: Type check (tests)
        run: |
          cd clients/cli
          npm run typecheck:tests

      - name: Test (vitest)
        run: |
          cd clients/cli
          npm test

  # ===========================================
  # TypeScript SDK
  # ===========================================
  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install dependencies
        run: |
          cd clients/typescript
          npm ci

      - name: Type check
        run: |
          cd clients/typescript
          npm run typecheck

      - name: Build
        run: |
          cd clients/typescript
          npm run build

      - name: Verify build output
        run: |
          cd clients/typescript
          test -f dist/index.js && echo "✅ CJS build OK"
          test -f dist/index.mjs && echo "✅ ESM build OK"
          test -f dist/index.d.ts && echo "✅ DTS build OK"

  # ===========================================
  # Docker Build
  # ===========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: acn:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

