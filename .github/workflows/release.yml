name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ===========================================
  # Build & Test
  # ===========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Test ACN Core
        run: uv run pytest -v
        env:
          REDIS_URL: redis://localhost:6379
          ENABLE_DOCS: "true"

  # ===========================================
  # Publish Python SDK to PyPI
  # ===========================================
  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: [test]
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: |
          cd clients/python
          uv build

      - name: Publish to PyPI
        run: |
          cd clients/python
          PKG_VER=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          if pip index versions acn-client 2>/dev/null | grep -q "${PKG_VER}"; then
            echo "acn-client ${PKG_VER} already on PyPI, skipping"
          else
            uv publish
          fi
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # ===========================================
  # Publish TypeScript SDK to npm
  # ===========================================
  publish-npm:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: [test]
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          cd clients/typescript
          npm ci

      - name: Build
        run: |
          cd clients/typescript
          npm run build

      - name: Publish to npm
        run: |
          cd clients/typescript
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version 2>/dev/null | grep -q "^${PKG_VER}$"; then
            echo "${PKG_NAME}@${PKG_VER} already on npm, skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_UNSCOPED }}

  # ===========================================
  # Publish CLI to npm
  # ===========================================
  publish-cli:
    name: Publish CLI
    runs-on: ubuntu-latest
    needs: [test]
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          cd clients/cli
          npm ci

      - name: Build
        run: |
          cd clients/cli
          npm run build

      - name: Publish to npm
        run: |
          cd clients/cli
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version 2>/dev/null | grep -q "^${PKG_VER}$"; then
            echo "${PKG_NAME}@${PKG_VER} already on npm, skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===========================================
  # Docker Image
  # ===========================================
  docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/acn:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/acn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Create GitHub Release
  # ===========================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-python, publish-npm, publish-cli, docker]

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

